name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait
      - run: docker compose ps
      - run: docker compose --profile baseline run --rm baseline
      - run: docker compose --profile battery-check run --rm battery-check
      - run: EMS_MODE=automatic docker compose up -d --force-recreate --no-deps gateway
      - run: docker compose --profile self-consumption-check run --rm --no-deps self-consumption-check
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
