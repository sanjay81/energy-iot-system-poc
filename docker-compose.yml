services:
  mqtt:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 4s
      retries: 10

  simulators:
    build: .
    command: ["python", "-m", "simulators.coordinator"]
    environment:
      SIMULATOR_HOST: "0.0.0.0"
      BATTERY_STATE_FILE: /data/battery_state.json
    volumes:
      - simulator-data:/data
    ports:
      - "5020:5020"
      - "5021:5021"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5020), 2).close(); socket.create_connection(('localhost', 5021), 2).close()"]
      interval: 5s
      timeout: 4s
      retries: 10

  gateway:
    build: .
    environment:
      INVERTER_HOST: simulators
      POWERMETER_HOST: simulators
      MQTT_HOST: mqtt
      BUFFER_FILE: /data/iot_buffer.json
      ENERGY_STATE_FILE: /data/energy_accounting.json
      ENERGY_TIMEZONE: Europe/Berlin
      BATTERY_CONTROL_STATE_FILE: /data/battery_control.json
      EMS_MODE: ${EMS_MODE:-manual}
      CONTROLLER_STATE_FILE: /data/self_consumption_controller.json
      CONTROLLER_MAX_POWER_W: "3000"
      CONTROLLER_STALE_AFTER_SECONDS: "15"
      CONTROLLER_DEADBAND_W: "50"
      POLL_INTERVAL: "5"
    volumes:
      - gateway-data:/data
    depends_on:
      mqtt:
        condition: service_healthy
      simulators:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: .
    command: ["python", "-m", "cloud.dashboard"]
    environment:
      MQTT_HOST: mqtt
    depends_on:
      mqtt:
        condition: service_healthy
      gateway:
        condition: service_started
    profiles: ["dashboard"]
    tty: true

  baseline:
    build: .
    command:
      - python
      - -m
      - simulations.baseline_day
      - --mqtt-host
      - mqtt
      - --output
      - /results/baseline_report.json
      - --verify
      - simulations/golden/baseline_report.json
      - --headless
    environment:
      MQTT_HOST: mqtt
    volumes:
      - ./results:/results
    depends_on:
      mqtt:
        condition: service_healthy
    profiles: ["baseline"]

  battery-check:
    build: .
    command: ["python", "-m", "simulations.battery_control_check"]
    environment:
      MQTT_HOST: mqtt
      DEVICE_ID: energy_iot_001
    depends_on:
      mqtt:
        condition: service_healthy
      gateway:
        condition: service_started
    profiles: ["battery-check"]

  self-consumption-check:
    build: .
    command: ["python", "-m", "simulations.self_consumption_check"]
    environment:
      MQTT_HOST: mqtt
      DEVICE_ID: energy_iot_001
    depends_on:
      mqtt:
        condition: service_healthy
      gateway:
        condition: service_started
    profiles: ["self-consumption-check"]

  comparison:
    build: .
    command:
      - python
      - -m
      - simulations.smart_comparison
      - --mqtt-host
      - mqtt
      - --output
      - /results/comparison_report.json
      - --verify
      - simulations/golden/comparison_report.json
      - --headless
    environment:
      MQTT_HOST: mqtt
    volumes:
      - ./results:/results
    depends_on:
      mqtt:
        condition: service_healthy
    profiles: ["comparison"]

volumes:
  mqtt-data:
  gateway-data:
  simulator-data:
